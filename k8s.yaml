apiVersion: apps/v1
kind: Deployment

metadata:
  name: ltv-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ltv-api

  template:
    metadata:
      labels:
        app: ltv-api

    spec:
      containers:
      - name: ltv-api
        image: ltv-api:latest
        imagePullPolicy: Never

        ports:
        - containerPort: 8000

---
apiVersion: v1
kind: Service

metadata:
  name: ltv-service

spec:
  selector:
    app: ltv-api

  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000

  type: NodePort